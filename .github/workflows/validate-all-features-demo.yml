name: Validate all-features demo

on:
  pull_request:
    paths:
      - ".github/workflows/validate-all-features-demo.yml"
      - ".gitmodules"
      - "doubtfire-api"
      - "doubtfire-web"
      - "development/all-features-demo/**"
      - "development/docker-compose.yml"
      - "development/docker-compose.local-paths.yml"
      - "development/proxy.conf.docker.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-demo-configuration:
    name: Shell and Compose configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive

      - name: Check helper shell syntax
        run: bash -n development/all-features-demo/demo.sh

      - name: Render merged Compose configuration
        run: development/all-features-demo/demo.sh config > /dev/null
