# Public, disposable synthetic data only. This is separate from production/.
# The project/database names deliberately cannot be changed through .env.
name: ontrack-public-demo

x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

x-runtime: &runtime
  restart: unless-stopped
  logging: *logging

x-api-environment: &api-environment
  RAILS_ENV: production
  TZ: Australia/Melbourne
  DF_LOG_TO_STDOUT: "true"
  DF_DEMO_DATA_PROFILE: public-demo
  DF_AUTH_METHOD: database
  DF_PRODUCTION_DB_ADAPTER: mysql2
  DF_PRODUCTION_DB_HOST: db
  DF_PRODUCTION_DB_DATABASE: doubtfire-public-demo
  DF_PRODUCTION_DB_USERNAME: dfire
  DF_PRODUCTION_DB_PASSWORD: ${MARIADB_PASSWORD:?Run Start OnTrack.cmd first}
  DF_SECRET_KEY_BASE: ${DF_SECRET_KEY_BASE:?Run Start OnTrack.cmd first}
  DF_SECRET_KEY_ATTR: ${DF_SECRET_KEY_ATTR:?Run Start OnTrack.cmd first}
  DF_SECRET_KEY_DEVISE: ${DF_SECRET_KEY_DEVISE:?Run Start OnTrack.cmd first}
  DF_ENCRYPTION_PRIMARY_KEY: ${DF_ENCRYPTION_PRIMARY_KEY:?Run Start OnTrack.cmd first}
  DF_ENCRYPTION_DETERMINISTIC_KEY: ${DF_ENCRYPTION_DETERMINISTIC_KEY:?Run Start OnTrack.cmd first}
  DF_ENCRYPTION_KEY_DERIVATION_SALT: ${DF_ENCRYPTION_KEY_DERIVATION_SALT:?Run Start OnTrack.cmd first}
  DF_INSTITUTION_HOST: https://${PUBLIC_HOST:-ontrack.maplefox.au}
  DF_INSTITUTION_PRODUCT_NAME: OnTrack Demo
  DF_INSTITUTION_NAME: OnTrack Public Demonstration
  DF_INSTITUTION_SETTINGS_RB: no_institution_setting.rb
  DF_INSTITUTION_EMAIL_DOMAIN: ontrack-demo.invalid
  DF_INSTITUTION_EMAIL_SENDER: noreply@ontrack-demo.invalid
  DF_STUDENT_WORK_DIR: /student-work
  DF_REDIS_SIDEKIQ_URL: redis://redis:6379/0
  DF_MAIL_PERFORM_DELIVERIES: "yes"
  DF_MAIL_DELIVERY_METHOD: smtp
  DF_SMTP_ADDRESS: mailpit
  DF_SMTP_PORT: "1025"
  DF_SMTP_DOMAIN: ontrack-demo.invalid
  DF_SMTP_AUTHENTICATION: none
  DF_SMTP_ENABLE_STARTTLS_AUTO: "false"
  DF_PPI_MINIMUM_COHORT_SIZE: "21"
  DF_PPI_STALE_AFTER_HOURS: "48"
  DOUBTFIRE_VAPID_PUBLIC_KEY: ${DOUBTFIRE_VAPID_PUBLIC_KEY:?Run Start OnTrack.cmd first}
  DOUBTFIRE_VAPID_PRIVATE_KEY: ${DOUBTFIRE_VAPID_PRIVATE_KEY:?Run Start OnTrack.cmd first}
  DOUBTFIRE_VAPID_SUBJECT: https://${PUBLIC_HOST:-ontrack.maplefox.au}
  DF_TEAMS_ANNOUNCEMENTS_ENABLED: "false"
  DF_TEAMS_CHANNEL_MAPPINGS: "[]"
  OVERSEER_ENABLED: "0"
  TII_ENABLED: "false"
  TUTORIAL_ENABLED: "1"

x-student-volumes: &student-volumes
  - student_work:/student-work
  - jplag_reports:/student-work/jplag
  - jplag_archive:/student-work/archive/jplag
  - application_logs:/doubtfire/log

services:
  db:
    <<: *runtime
    image: mariadb:12.3@sha256:805c8e104bd563d5bfa24fadd3f31cd419ea859cb5277f32b5dbf2db714f9ed1
    environment:
      MARIADB_DATABASE: doubtfire-public-demo
      MARIADB_USER: dfire
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Run Start OnTrack.cmd first}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run Start OnTrack.cmd first}
      TZ: Australia/Melbourne
    volumes: [database:/var/lib/mysql]
    networks: [data]
    mem_limit: 4g
    cpus: 2
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    <<: *runtime
    image: redis:7.4@sha256:c6eabf748fc7a61dbb5a705c78bcf3d6377b1127a97d0ce965c11c44ba46896f
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes: [redis_data:/data]
    networks: [data]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    <<: *runtime
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    ports: ["127.0.0.1:8025:8025"]
    environment:
      MP_MAX_MESSAGES: "500"
      MP_DATABASE: /data/mailpit.db
    volumes: [mail:/data]
    networks: [data]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20

  bootstrap:
    image: ontrack-public-demo-api:local
    profiles: [setup]
    environment: *api-environment
    command: [bundle, exec, rake, "db:public_demo_prepare"]
    volumes: *student-volumes
    networks: [data]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    restart: "no"
    logging: *logging

  migrate:
    image: ontrack-public-demo-api:local
    environment: *api-environment
    command: [bundle, exec, rails, "db:migrate"]
    volumes: *student-volumes
    networks: [data]
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
    logging: *logging

  apiserver:
    <<: *runtime
    image: ontrack-public-demo-api:local
    build:
      context: ${DF_PUBLIC_DEMO_API_PATH:-../doubtfire-api}
      dockerfile: deployApi.Dockerfile
    environment: *api-environment
    command: [bundle, exec, rails, server, -b, 0.0.0.0]
    volumes: *student-volumes
    networks: [edge, data]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    init: true
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:3000/readiness]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  webserver:
    <<: *runtime
    image: ontrack-public-demo-web:local
    build:
      context: ${DF_PUBLIC_DEMO_WEB_PATH:-../doubtfire-web}
      dockerfile: deploy.Dockerfile
    networks: [edge]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1/index.html]
      interval: 10s
      timeout: 5s
      retries: 10

  sidekiq:
    <<: *runtime
    image: ontrack-public-demo-app:local
    build:
      context: ${DF_PUBLIC_DEMO_API_PATH:-../doubtfire-api}
      dockerfile: deployAppSvr.Dockerfile
    environment:
      <<: *api-environment
      DF_SIDEKIQ_CONCURRENCY: "5"
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      LATEX_BUILD_PATH: /texlive/shell/latex_build.sh
      LATEX_CONTAINER_NAME: ontrack-public-demo-texlive-sidekiq
    command: [/doubtfire/lib/shell/sidekiq_entry_point.sh]
    volumes:
      - student_work:/student-work
      - jplag_reports:/student-work/jplag
      - jplag_archive:/student-work/archive/jplag
      - application_logs:/doubtfire/log
      - ./aliases:/etc/aliases:ro
      - ./msmtprc:/shared-files/msmtprc:ro
      - latex_sidekiq:/doubtfire/tmp/rails-latex
    networks: [data, egress, docker-api]
    depends_on:
      apiserver: {condition: service_healthy}
      docker-socket-proxy: {condition: service_healthy}
      texlive-sidekiq: {condition: service_healthy}
    init: true
    mem_limit: 4g
    cpus: 4
    stop_grace_period: 45s
    healthcheck:
      test:
        - CMD
        - bundle
        - exec
        - ruby
        - -rsidekiq/api
        - -e
        - >-
          Sidekiq.configure_client { |c| c.redis = { url: ENV.fetch('DF_REDIS_SIDEKIQ_URL') } };
          exit(Sidekiq::ProcessSet.new.any? { |p| p['hostname'] == ENV['HOSTNAME'] } ? 0 : 1)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  pdfgen:
    <<: *runtime
    image: ontrack-public-demo-app:local
    environment:
      <<: *api-environment
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      LATEX_BUILD_PATH: /texlive/shell/latex_build.sh
      LATEX_CONTAINER_NAME: ontrack-public-demo-texlive-pdfgen
    command: [/doubtfire/lib/shell/pdfgen_entry_point.sh]
    volumes:
      - student_work:/student-work
      - jplag_reports:/student-work/jplag
      - jplag_archive:/student-work/archive/jplag
      - application_logs:/doubtfire/log
      - ./aliases:/etc/aliases:ro
      - ./msmtprc:/shared-files/msmtprc:ro
      - latex_pdfgen:/doubtfire/tmp/rails-latex
      - jplag_tmp:/doubtfire/tmp/jplag
    networks: [data, egress, docker-api]
    depends_on:
      apiserver: {condition: service_healthy}
      docker-socket-proxy: {condition: service_healthy}
      texlive-pdfgen: {condition: service_healthy}
      jplag: {condition: service_healthy}
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
    healthcheck:
      test: [CMD-SHELL, "test -r /container.env && test \"$$(cat /proc/1/comm)\" = cron"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  texlive-sidekiq:
    <<: *runtime
    image: ontrack-public-demo-texlive:local
    build:
      context: ${DF_PUBLIC_DEMO_API_PATH:-../doubtfire-api}
      dockerfile: texlive.Dockerfile
    container_name: ontrack-public-demo-texlive-sidekiq
    network_mode: none
    volumes: [latex_sidekiq:/workdir/texlive-latex]
    command: [sh, -c, sleep infinity]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, test, -x, /texlive/shell/latex_build.sh]
      interval: 30s
      timeout: 5s
      retries: 3

  texlive-pdfgen:
    <<: *runtime
    image: ontrack-public-demo-texlive:local
    container_name: ontrack-public-demo-texlive-pdfgen
    network_mode: none
    volumes: [latex_pdfgen:/workdir/texlive-latex]
    command: [sh, -c, sleep infinity]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, test, -x, /texlive/shell/latex_build.sh]
      interval: 30s
      timeout: 5s
      retries: 3

  jplag:
    <<: *runtime
    image: ontrack-public-demo-jplag:local
    build:
      context: ${DF_PUBLIC_DEMO_API_PATH:-../doubtfire-api}
      dockerfile: jplag.Dockerfile
    # The inherited API invokes this exact container name.
    container_name: jplag
    network_mode: none
    volumes:
      - jplag_reports:/student-work/jplag
      - jplag_archive:/student-work/archive/jplag
      - jplag_tmp:/tmp/jplag
    command: [sh, -c, sleep infinity]
    mem_limit: 4g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, test, -s, /jplag/jplag-jar-with-dependencies.jar]
      interval: 30s
      timeout: 5s
      retries: 3

  docker-socket-proxy:
    <<: *runtime
    image: haproxy:3.2-alpine@sha256:1392e5f7a83ddf820b020fe2b099f08a2311a9b8e9212c0285119dd13903ff1c
    command:
      - /bin/sh
      - -ec
      - >-
        sed 's/__PROJECT_NAME__/ontrack-public-demo/g'
        /usr/local/etc/haproxy/docker-api.cfg.template > /tmp/docker-api.cfg
        && exec haproxy -W -db -f /tmp/docker-api.cfg
    networks: [docker-api]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ../production/docker-socket-proxy.cfg:/usr/local/etc/haproxy/docker-api.cfg.template:ro
    read_only: true
    tmpfs: [/run, /tmp]
    user: "0:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 1
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:2375/_ping]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    <<: *runtime
    image: ontrack-public-demo-proxy:local
    build:
      context: .
      dockerfile: proxy.Dockerfile
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-ontrack.maplefox.au}
      NGINX_ENVSUBST_FILTER: ^PUBLIC_HOST$$
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./proxy-nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks: [edge]
    depends_on:
      apiserver: {condition: service_healthy}
      webserver: {condition: service_healthy}
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1/healthz]
      interval: 10s
      timeout: 5s
      retries: 10

  cloudflared:
    <<: *runtime
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    profiles: [tunnel]
    command: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run, --token-file, /run/secrets/tunnel_token]
    secrets: [tunnel_token]
    networks: [edge]
    depends_on:
      proxy: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, "127.0.0.1:2000", ready]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  quick-tunnel:
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    profiles: [quick]
    command: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", --url, http://proxy:80]
    networks: [edge]
    depends_on:
      proxy: {condition: service_healthy}
    restart: "no"
    logging: *logging
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: [CMD, cloudflared, tunnel, --metrics, "127.0.0.1:2000", ready]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  edge:
  data:
    internal: true
  egress:
  docker-api:
    internal: true

volumes:
  database:
  redis_data:
  student_work:
  jplag_reports:
  jplag_archive:
  application_logs:
  latex_sidekiq:
  latex_pdfgen:
  jplag_tmp:
  mail:

secrets:
  tunnel_token:
    file: ./secrets/tunnel-token.txt
